<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota Fiscal Eletronica NF-e</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #242a42 0%, #000000 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .form-section {
            margin-bottom: 35px;
        }
        .section-title {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #000000;
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #000000;
            border-radius: 50%;
            margin-right: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="text"],
        input[type="file"],
        input[type="number"] {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus,
        input[type="file"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #010205;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .logo-upload {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .logo-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .logo-preview {
            max-width: 150px;
            max-height: 100px;
            margin: 10px auto;
            display: none;
        }
        .products-section {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e1e5e9;
        }
        .product-item {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #505157 0%, #000001 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(15, 16, 21, 0.3);
        }
        .btn-secondary {
            background: #28a745;
            color: white;
        }
        .btn-secondary:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .total-section {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        .total-section h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .total-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: block;
        }
        .success {
            color: #28a745;
            font-size: 14px;
            margin-top: 5px;
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0b0e19;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        /* Estilos para o sistema de controle de acesso */
        .plan-card {
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .plan-card:hover {
            border-color: #007bff;
            box-shadow: 0 5px 15px rgba(0,123,255,0.1);
        }
        .plan-card h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .plan-card .price {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
        }
        .plan-card .duration {
            color: #666;
            margin-bottom: 20px;
        }
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .copy-pix-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .copy-pix-btn:hover {
            background: #138496;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .form-container {
                padding: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .product-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .actions {
                flex-direction: column;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧾 Gerador de Nota Fiscal do 🎰  7️⃣ 7️⃣ 7️⃣</h1>
            <p>Sistema para geração de notas fiscais</p>
        </div>
        <div class="form-container">
            <div id="notaFiscalForm">
                <!-- Dados da Empresa -->
                <div class="form-section">
                    <h2 class="section-title">Dados da Empresa</h2>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="logo">Logotipo da Empresa (PNG, SVG, JPG)</label>
                            <div class="logo-upload" onclick="document.getElementById('logo').click()">
                                <input type="file" id="logo" accept=".png,.svg,.jpg,.jpeg" style="display: none;">
                                <p id="logoText">Clique para selecionar ou arraste o arquivo aqui</p>
                                <img id="logoPreview" class="logo-preview" alt="Preview do logo">
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label for="razaoSocial">Razão Social *</label>
                            <input type="text" id="razaoSocial" required>
                        </div>
                        <div class="form-group">
                            <label for="cnpj">CNPJ *</label>
                            <input type="text" id="cnpj" required placeholder="00.000.000/0000-00">
                            <span id="cnpjError" class="error"></span>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone *</label>
                            <input type="text" id="telefone" required placeholder="(00) 00000-0000">
                        </div>
                        <div class="form-group">
                            <label for="cep">CEP *</label>
                            <input type="text" id="cep" required placeholder="00000-000">
                            <span id="cepError" class="error"></span>
                            <div id="cepLoading" class="loading">
                                <div class="spinner"></div>
                                <p>Buscando endereço...</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="numero">Número *</label>
                            <input type="text" id="numero" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="logradouro">Logradouro</label>
                            <input type="text" id="logradouro" readonly>
                        </div>
                        <div class="form-group">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento">
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" readonly>
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" readonly>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" readonly>
                        </div>
                    </div>
                </div>
                <!-- Dados do Cliente -->
                <div class="form-section">
                    <h2 class="section-title">Dados do Cliente</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nomeCliente">Nome do Cliente *</label>
                            <input type="text" id="nomeCliente" required>
                        </div>
                        <div class="form-group">
                            <label for="cpfCliente">CPF do Cliente *</label>
                            <input type="text" id="cpfCliente" required placeholder="000.000.000-00">
                            <span id="cpfError" class="error"></span>
                        </div>
                        <div class="form-group">
                            <label for="cepCliente">CEP do Cliente *</label>
                            <input type="text" id="cepCliente" required placeholder="00000-000">
                            <span id="cepClienteError" class="error"></span>
                            <div id="cepClienteLoading" class="loading">
                                <div class="spinner"></div>
                                <p>Buscando endereço...</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="numeroCliente">Número *</label>
                            <input type="text" id="numeroCliente" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="logradouroCliente">Logradouro</label>
                            <input type="text" id="logradouroCliente" readonly>
                        </div>
                        <div class="form-group">
                            <label for="complementoCliente">Complemento</label>
                            <input type="text" id="complementoCliente">
                        </div>
                        <div class="form-group">
                            <label for="bairroCliente">Bairro</label>
                            <input type="text" id="bairroCliente" readonly>
                        </div>
                        <div class="form-group">
                            <label for="cidadeCliente">Cidade</label>
                            <input type="text" id="cidadeCliente" readonly>
                        </div>
                        <div class="form-group">
                            <label for="estadoCliente">Estado</label>
                            <input type="text" id="estadoCliente" readonly>
                        </div>
                    </div>
                </div>
                <!-- Produtos/Serviços -->
                <div class="form-section">
                    <h2 class="section-title">Produtos/Serviços</h2>
                    <div class="products-section">
                        <div id="produtosList">
                            <div class="product-item" data-index="0">
                                <div class="form-group">
                                    <label>Descrição *</label>
                                    <input type="text" class="produto-descricao" required>
                                </div>
                                <div class="form-group">
                                    <label>Preço (R$) *</label>
                                    <input type="number" class="produto-preco" step="0.01" min="0" required>
                                </div>
                                <button type="button" class="btn btn-danger" onclick="removerProduto(this)" style="margin-top: 25px;">Remover</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary" onclick="adicionarProduto()">+ Adicionar Produto</button>
                        
                        <div class="total-section">
                            <h3>Total da Nota Fiscal</h3>
                            <div class="total-value" id="totalValue">R$ 0,00</div>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-primary" onclick="gerarPDF()">📄 Gerar PDF</button>
                    <button type="button" class="btn btn-secondary" onclick="limparFormulario()">🗑️ Limpar Formulário</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let logoBase64 = null;
        let produtoCounter = 0;
        
        // Sistema de Controle de Acesso e Planos
        class AccessControlSystem {
            constructor() {
                this.storageKey = 'notaFiscalSystem';
                this.init();
            }

            init() {
                // Inicializar dados se não existirem
                if (!localStorage.getItem(this.storageKey)) {
                    this.resetData();
                }
                
                // Verificar status do sistema
                this.checkSystemStatus();
                
                // Configurar eventos
                this.setupEventListeners();
            }

            resetData() {
                const initialData = {
                    freeNotesUsed: 0,
                    freeNotesLimit: 5,
                    currentPlan: null,
                    planStartDate: null,
                    planEndDate: null,
                    notesUsedInPlan: 0,
                    planNotesLimit: 0,
                    usedPasswords: []
                };
                localStorage.setItem(this.storageKey, JSON.stringify(initialData));
            }

            getData() {
                return JSON.parse(localStorage.getItem(this.storageKey));
            }

            saveData(data) {
                localStorage.setItem(this.storageKey, JSON.stringify(data));
            }

            // Senhas de ativação para cada plano (20 senhas cada)
            getActivationPasswords() {
                return {
                    plan50: [
                        'NF50-A1B2C3D4', 'NF50-E5F6G7H8', 'NF50-I9J0K1L2', 'NF50-M3N4O5P6',
                        'NF50-Q7R8S9T0', 'NF50-U1V2W3X4', 'NF50-Y5Z6A7B8', 'NF50-C9D0E1F2',
                        'NF50-G3H4I5J6', 'NF50-K7L8M9N0', 'NF50-O1P2Q3R4', 'NF50-S5T6U7V8',
                        'NF50-W9X0Y1Z2', 'NF50-A3B4C5D6', 'NF50-E7F8G9H0', 'NF50-I1J2K3L4',
                        'NF50-M5N6O7P8', 'NF50-Q9R0S1T2', 'NF50-U3V4W5X6', 'NF50-Y7Z8A9B0'
                    ],
                    plan100: [
                        'NF100-X1Y2Z3A4', 'NF100-B5C6D7E8', 'NF100-F9G0H1I2', 'NF100-J3K4L5M6',
                        'NF100-N7O8P9Q0', 'NF100-R1S2T3U4', 'NF100-V5W6X7Y8', 'NF100-Z9A0B1C2',
                        'NF100-D3E4F5G6', 'NF100-H7I8J9K0', 'NF100-L1M2N3O4', 'NF100-P5Q6R7S8',
                        'NF100-T9U0V1W2', 'NF100-X3Y4Z5A6', 'NF100-B7C8D9E0', 'NF100-F1G2H3I4',
                        'NF100-J5K6L7M8', 'NF100-N9O0P1Q2', 'NF100-R3S4T5U6', 'NF100-V7W8X9Y0'
                    ],
                    planUnlimited: [
                        'NFUNL-Z1A2B3C4', 'NFUNL-D5E6F7G8', 'NFUNL-H9I0J1K2', 'NFUNL-L3M4N5O6',
                        'NFUNL-P7Q8R9S0', 'NFUNL-T1U2V3W4', 'NFUNL-X5Y6Z7A8', 'NFUNL-B9C0D1E2',
                        'NFUNL-F3G4H5I6', 'NFUNL-J7K8L9M0', 'NFUNL-N1O2P3Q4', 'NFUNL-R5S6T7U8',
                        'NFUNL-V9W0X1Y2', 'NFUNL-Z3A4B5C6', 'NFUNL-D7E8F9G0', 'NFUNL-H1I2J3K4',
                        'NFUNL-L5M6N7O8', 'NFUNL-P9Q0R1S2', 'NFUNL-T3U4V5W6', 'NFUNL-X7Y8Z9A0'
                    ]
                };
            }

            checkSystemStatus() {
                const data = this.getData();
                
                // Verificar se o plano expirou
                if (data.currentPlan && data.planEndDate) {
                    const now = new Date();
                    const endDate = new Date(data.planEndDate);
                    
                    if (now > endDate) {
                        // Plano expirado
                        data.currentPlan = null;
                        data.planStartDate = null;
                        data.planEndDate = null;
                        data.notesUsedInPlan = 0;
                        data.planNotesLimit = 0;
                        this.saveData(data);
                    }
                }
                
                // Verificar se atingiu o limite do plano
                if (data.currentPlan && data.currentPlan !== 'unlimited') {
                    if (data.notesUsedInPlan >= data.planNotesLimit) {
                        // Limite atingido
                        data.currentPlan = null;
                        data.planStartDate = null;
                        data.planEndDate = null;
                        data.notesUsedInPlan = 0;
                        data.planNotesLimit = 0;
                        this.saveData(data);
                    }
                }
            }

            canGenerateNote() {
                const data = this.getData();
                
                // Se tem plano ativo
                if (data.currentPlan) {
                    if (data.currentPlan === 'unlimited') {
                        return true;
                    } else {
                        return data.notesUsedInPlan < data.planNotesLimit;
                    }
                }
                
                // Se não tem plano, verificar limite gratuito
                return data.freeNotesUsed < data.freeNotesLimit;
            }

            incrementNoteUsage() {
                const data = this.getData();
                
                if (data.currentPlan) {
                    data.notesUsedInPlan++;
                } else {
                    data.freeNotesUsed++;
                }
                
                this.saveData(data);
            }

            getUsageStatus() {
                const data = this.getData();
                
                if (data.currentPlan) {
                    if (data.currentPlan === 'unlimited') {
                        return {
                            type: 'unlimited',
                            message: `Plano Ilimitado ativo até ${new Date(data.planEndDate).toLocaleDateString('pt-BR')}`
                        };
                    } else {
                        const remaining = data.planNotesLimit - data.notesUsedInPlan;
                        return {
                            type: 'paid',
                            message: `Plano ${data.planNotesLimit} notas: ${remaining} restantes até ${new Date(data.planEndDate).toLocaleDateString('pt-BR')}`
                        };
                    }
                } else {
                    const remaining = data.freeNotesLimit - data.freeNotesUsed;
                    return {
                        type: 'free',
                        message: `Acesso gratuito: ${remaining} notas restantes`
                    };
                }
            }

            activatePlan(password) {
                const passwords = this.getActivationPasswords();
                const data = this.getData();
                
                // Verificar se a senha já foi usada
                if (data.usedPasswords.includes(password)) {
                    return { success: false, message: 'Esta senha já foi utilizada.' };
                }
                
                let planType = null;
                let planLimit = 0;
                
                // Verificar qual plano corresponde à senha
                if (passwords.plan50.includes(password)) {
                    planType = '50';
                    planLimit = 50;
                } else if (passwords.plan100.includes(password)) {
                    planType = '100';
                    planLimit = 100;
                } else if (passwords.planUnlimited.includes(password)) {
                    planType = 'unlimited';
                    planLimit = 0; // Ilimitado
                } else {
                    return { success: false, message: 'Senha de ativação inválida.' };
                }
                
                // Ativar o plano
                const now = new Date();
                const endDate = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000)); // 30 dias
                
                data.currentPlan = planType;
                data.planStartDate = now.toISOString();
                data.planEndDate = endDate.toISOString();
                data.notesUsedInPlan = 0;
                data.planNotesLimit = planLimit;
                data.usedPasswords.push(password);
                
                this.saveData(data);
                
                return { 
                    success: true, 
                    message: `Plano ${planType === 'unlimited' ? 'Ilimitado' : planType + ' notas'} ativado com sucesso! Válido até ${endDate.toLocaleDateString('pt-BR')}.` 
                };
            }

            setupEventListeners() {
                // Interceptar a função original de gerar PDF
                const originalGerarPDF = window.gerarPDF;
                
                window.gerarPDF = () => {
                    if (!this.canGenerateNote()) {
                        this.showPaymentModal();
                        return;
                    }
                    
                    // Executar a função original
                    originalGerarPDF();
                    
                    // Incrementar uso
                    this.incrementNoteUsage();
                    
                    // Atualizar status
                    this.updateStatusDisplay();
                };
            }

            updateStatusDisplay() {
                const status = this.getUsageStatus();
                let statusElement = document.getElementById('usageStatus');
                
                if (!statusElement) {
                    statusElement = document.createElement('div');
                    statusElement.id = 'usageStatus';
                    statusElement.style.cssText = `
                        background: #f8f9fa;
                        border: 1px solid #dee2e6;
                        border-radius: 8px;
                        padding: 15px;
                        margin: 20px 0;
                        text-align: center;
                        font-weight: 600;
                    `;
                    
                    const container = document.querySelector('.form-container');
                    container.insertBefore(statusElement, container.firstChild);
                }
                
                statusElement.textContent = status.message;
                
                // Cores diferentes para cada tipo
                if (status.type === 'free') {
                    statusElement.style.background = '#fff3cd';
                    statusElement.style.borderColor = '#ffeaa7';
                    statusElement.style.color = '#856404';
                } else if (status.type === 'paid') {
                    statusElement.style.background = '#d1ecf1';
                    statusElement.style.borderColor = '#bee5eb';
                    statusElement.style.color = '#0c5460';
                } else {
                    statusElement.style.background = '#d4edda';
                    statusElement.style.borderColor = '#c3e6cb';
                    statusElement.style.color = '#155724';
                }
            }

            showPaymentModal() {
                // Remover modal existente se houver
                const existingModal = document.getElementById('paymentModal');
                if (existingModal) {
                    existingModal.remove();
                }
                
                // Criar modal
                const modal = document.createElement('div');
                modal.id = 'paymentModal';
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 10000;
                `;
                
                modal.innerHTML = `
                    <div style="
                        background: white;
                        border-radius: 15px;
                        padding: 30px;

        function validarCNPJ() {
            const cnpj = document.getElementById('cnpj').value.replace(/\D/g, '');
            const errorDiv = document.getElementById('cnpjError');
            
            if (cnpj.length === 0) {
                errorDiv.textContent = '';
                return true;
            }
            
            if (cnpj.length !== 14) {
                errorDiv.textContent = 'CNPJ deve ter 14 dígitos';
                return false;
            }
            
            // Verificar se não são todos números iguais
            if (/^(\d)\1+$/.test(cnpj)) {
                errorDiv.textContent = 'CNPJ inválido';
                return false;
            }
            
            errorDiv.textContent = '';
            return true;
        }
        
        function validarCPF() {
            const cpf = document.getElementById('cpfCliente').value.replace(/\D/g, '');
            const errorDiv = document.getElementById('cpfError');
            
            if (cpf.length === 0) {
                errorDiv.textContent = '';
                return true;
            }
            
            if (cpf.length !== 11) {
                errorDiv.textContent = 'CPF deve ter 11 dígitos';
                return false;
            }
            
            // Verificar se não são todos números iguais
            if (/^(\d)\1+$/.test(cpf)) {
                errorDiv.textContent = 'CPF inválido';
                return false;
            }
            
            errorDiv.textContent = '';
            return true;
        }
        
        async function buscarCEP() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const errorDiv = document.getElementById('cepError');
            const loadingDiv = document.getElementById('cepLoading');
            
            if (cep.length !== 8) {
                if (cep.length > 0) {
                    errorDiv.textContent = 'CEP deve ter 8 dígitos';
                }
                return;
            }
            
            loadingDiv.style.display = 'block';
            errorDiv.textContent = '';
            
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                
                if (data.erro) {
                    throw new Error('CEP não encontrado');
                }
                
                document.getElementById('logradouro').value = data.logradouro || '';
                document.getElementById('bairro').value = data.bairro || '';
                document.getElementById('cidade').value = data.localidade || '';
                document.getElementById('estado').value = data.uf || '';
                
                errorDiv.textContent = '';
                errorDiv.className = 'success';
                errorDiv.textContent = 'Endereço encontrado!';
                
                setTimeout(() => {
                    errorDiv.textContent = '';
                    errorDiv.className = 'error';
                }, 3000);
                
            } catch (error) {
                errorDiv.textContent = 'CEP não encontrado ou inválido';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function calcularTotal() {
            const precos = document.querySelectorAll('.produto-preco');
            let total = 0;
            
            precos.forEach(preco => {
                const valor = parseFloat(preco.value) || 0;
                total += valor;
            });
            
            const totalFormatted = total.toLocaleString('pt-BR', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });
            
            document.getElementById('totalValue').textContent = 'R$ ' + totalFormatted;
            
            return total;
        }
        
        function validarFormulario() {
            const camposObrigatorios = [
                { id: 'razaoSocial', nome: 'Razão Social' },
                { id: 'cnpj', nome: 'CNPJ' },
                { id: 'telefone', nome: 'Telefone' },
                { id: 'cep', nome: 'CEP' },
                { id: 'numero', nome: 'Número' },
                { id: 'nomeCliente', nome: 'Nome do Cliente' },
                { id: 'cpfCliente', nome: 'CPF do Cliente' },
                { id: 'cepCliente', nome: 'CEP do Cliente' },
                { id: 'numeroCliente', nome: 'Número do Cliente' }
            ];
            
            let camposVazios = [];
            let valido = true;
            
            // Verificar campos obrigatórios
            camposObrigatorios.forEach(campo => {
                const elemento = document.getElementById(campo.id);
                if (!elemento.value.trim()) {
                    elemento.style.borderColor = '#dc3545';
                    camposVazios.push(campo.nome);
                    valido = false;
                } else {
                    elemento.style.borderColor = '#e1e5e9';
                }
            });
            
            // Verificar produtos
            const produtos = document.querySelectorAll('.product-item');
            let produtoValido = false;
            let produtosVazios = [];
            
            produtos.forEach((produto, index) => {
                const descricao = produto.querySelector('.produto-descricao');
                const preco = produto.querySelector('.produto-preco');
                
                if (descricao.value.trim() && preco.value && parseFloat(preco.value) > 0) {
                    produtoValido = true;
                    descricao.style.borderColor = '#e1e5e9';
                    preco.style.borderColor = '#e1e5e9';
                } else {
                    if (!descricao.value.trim()) {
                        descricao.style.borderColor = '#dc3545';
                    }
                    if (!preco.value || parseFloat(preco.value) <= 0) {
                        preco.style.borderColor = '#dc3545';
                    }
                    produtosVazios.push(`Produto ${index + 1}`);
                }
            });
            
            // Validar CNPJ e CPF
            const cnpjValido = validarCNPJ();
            const cpfValido = validarCPF();
            
            if (!valido || !produtoValido || !cnpjValido || !cpfValido) {
                let mensagem = 'Por favor, corrija os seguintes problemas:\n\n';
                
                if (camposVazios.length > 0) {
                    mensagem += '• Campos obrigatórios vazios: ' + camposVazios.join(', ') + '\n';
                }
                
                if (produtosVazios.length > 0) {
                    mensagem += '• Produtos incompletos: ' + produtosVazios.join(', ') + '\n';
                }
                
                if (!cnpjValido) {
                    mensagem += '• CNPJ inválido\n';
                }
                
                if (!cpfValido) {
                    mensagem += '• CPF inválido\n';
                }
                
                alert(mensagem);
                return false;
            }
            
            return true;
        }
        
        function gerarPDF() {

                const doc = new jsPDF();
                
                // Configurações
                const pageWidth = doc.internal.pageSize.width;

                doc.setFontSize(20);
                doc.setFont('helvetica', 'bold');
                doc.text('NOTA FISCAL ELETRONICA NF-e', pageWidth / 2, currentY, { align: 'center' });
                currentY += 10;
                
                doc.setFontSize(12);
                doc.setFont('helvetica', 'normal');
                doc.text('1947 8472 8376 9372 8372 7276 9853 2610', pageWidth / 2, currentY, { align: 'center' });
                currentY += 20;
                
                // Logo (se houver)
                if (logoBase64) {
                    try {
                        doc.addImage(logoBase64, 'JPEG', margin, currentY, 40, 25);
                        currentY += 35;
                    } catch (e) {
                        console.warn('Erro ao adicionar logo:', e);
                        currentY += 10;
                    }
                }
                
                // Dados da Empresa
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text('DADOS DA EMPRESA', margin, currentY);
                currentY += 8;
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                
                const dadosEmpresa = [
                    `Razão Social: ${document.getElementById('razaoSocial').value}`,
                    `CNPJ: ${document.getElementById('cnpj').value}`,
                    `Telefone: ${document.getElementById('telefone').value}`,
                    `Endereço: ${document.getElementById('logradouro').value}, ${document.getElementById('numero').value}`,
                    `${document.getElementById('complemento').value ? document.getElementById('complemento').value + ', ' : ''}${document.getElementById('bairro').value}`,
                    `${document.getElementById('cidade').value} - ${document.getElementById('estado').value}`,
                    `CEP: ${document.getElementById('cep').value}`
                ];
                
                dadosEmpresa.forEach(linha => {
                    if (linha.trim() && !linha.includes('undefined') && linha !== ': ') {
                        doc.text(linha, margin, currentY);
                        currentY += 5;
                    }
                });
                
                currentY += 10;
                
                // Dados do Cliente
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text('DADOS DO CLIENTE', margin, currentY);
                currentY += 8;
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                
                const dadosCliente = [
                    `Nome: ${document.getElementById('nomeCliente').value}`,
                    `CPF: ${document.getElementById('cpfCliente').value}`,
                    `Endereço: ${document.getElementById('logradouroCliente').value}, ${document.getElementById('numeroCliente').value}`,
                    `${document.getElementById('complementoCliente').value ? document.getElementById('complementoCliente').value + ', ' : ''}${document.getElementById('bairroCliente').value}`,
                    `${document.getElementById('cidadeCliente').value} - ${document.getElementById('estadoCliente').value}`,
                    `CEP: ${document.getElementById('cepCliente').value}`
                ];
                
                dadosCliente.forEach(linha => {
                    if (linha.trim() && !linha.includes('undefined') && linha !== ': ' && linha !== ' - ') {
                        doc.text(linha, margin, currentY);
                        currentY += 5;
                    }
                });
                
                currentY += 10;
                
                // Produtos/Serviços
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text('PRODUTOS/SERVIÇOS', margin, currentY);
                currentY += 8;
                
                // Cabeçalho da tabela
                doc.setFontSize(10);
                doc.setFont('helvetica', 'bold');
                doc.text('Descrição', margin, currentY);
                doc.text('Preço (R$)', pageWidth - margin - 40, currentY);
                currentY += 5;
                
                // Linha separadora
                doc.line(margin, currentY, pageWidth - margin, currentY);
                currentY += 8;
                
                // Produtos
                doc.setFont('helvetica', 'normal');
                const produtos = document.querySelectorAll('.product-item');
                let total = 0;
                
                produtos.forEach(produto => {
                    const descricao = produto.querySelector('.produto-descricao').value;
                    const preco = parseFloat(produto.querySelector('.produto-preco').value) || 0;
                    total += preco;
                    
                    // Quebrar descrição se for muito longa
                    const descricaoLimitada = descricao.length > 50 ? descricao.substring(0, 47) + '...' : descricao;
                    
                    doc.text(descricaoLimitada, margin, currentY);
                    doc.text(`R$ ${preco.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`, pageWidth - margin - 40, currentY);
                    currentY += 6;
                });
                
                // Linha separadora
                currentY += 5;
                doc.line(margin, currentY, pageWidth - margin, currentY);
                currentY += 8;
                
                // Total
                doc.setFont('helvetica', 'bold');
                doc.text('TOTAL GERAL:', margin, currentY);
                doc.text(`R$ ${total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`, pageWidth - margin - 40, currentY);
                
                // Rodapé
                currentY += 20;
                doc.setFontSize(8);
                doc.setFont('helvetica', 'normal');
                doc.text('Esta é uma simplificada nota fiscal Eletronica NF-e.', pageWidth / 2, currentY, { align: 'center' });
                currentY += 5;
                doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, pageWidth / 2, currentY, { align: 'center' });
                
                // Salvar PDF
                const nomeArquivo = `nota_fiscal_${Date.now()}.pdf`;
                doc.save(nomeArquivo);
                
                console.log('PDF gerado com sucesso!');
                
            } catch (error) {
                console.error('Erro ao gerar PDF:', error);
                alert('Erro ao gerar PDF. Verifique os dados e tente novamente.');
            }
        }
        
        function limparFormulario() {
            if (confirm('Tem certeza que deseja limpar todos os dados do formulário?')) {
                document.getElementById('notaFiscalForm').reset();
                
                // Limpar logo
                logoBase64 = null;
                document.getElementById('logoPreview').style.display = 'none';
                document.getElementById('logoText').textContent = 'Clique para selecionar ou arraste o arquivo aqui';
                
                // Resetar produtos para apenas um
                const produtosList = document.getElementById('produtosList');
                produtosList.innerHTML = `
                    <div class="product-item" data-index="0">
                        <div class="form-group">
                            <label>Descrição *</label>
                            <input type="text" class="produto-descricao" required>
                        </div>
                        <div class="form-group">
                            <label>Preço (R$) *</label>
                            <input type="number" class="produto-preco" step="0.01" min="0" required>
                        </div>
                        <button type="button" class="btn btn-danger" onclick="removerProduto(this)" style="margin-top: 25px;">Remover</button>
                    </div>
                `;
                
                // Recalcular total
                calcularTotal();
                
                // Limpar mensagens de erro
                document.querySelectorAll('.error').forEach(error => {
                    error.textContent = '';
                });
                
                console.log('Formulário limpo com sucesso!');
            }
        }
        
        function testarFuncionalidades() {
            console.log('Testando funcionalidades...');
            
            // Testar se jsPDF está carregado
            if (typeof window.jspdf !== 'undefined') {
                console.log('✓ jsPDF carregado com sucesso');
            } else {
                console.error('✗ Erro: jsPDF não foi carregado');
            }
            
            // Testar se elementos existem
            const elementos = ['razaoSocial', 'cnpj', 'telefone', 'cep', 'nomeCliente', 'cpfCliente'];
            elementos.forEach(id => {
                const elemento = document.getElementById(id);
                if (elemento) {
                    console.log(`✓ Elemento ${id} encontrado`);
                } else {
                    console.error(`✗ Elemento ${id} não encontrado`);
                }
            });
            
            console.log('Teste de funcionalidades concluído!');
        }
    </script>
</body>
</html>
